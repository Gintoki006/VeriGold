networks:
  verigold-net:
    driver: bridge

volumes:
  redis-data:

services:
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verigold-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - verigold-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: verigold-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - verigold-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped


